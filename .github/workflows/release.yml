name: Release

# Self-contained release pipeline. Pushing a version tag (v*) verifies the
# build, produces the CLI binaries, and publishes the GitHub release carrying
# the binaries plus their supply-chain attestation (SHA256 checksums, an SPDX
# SBOM, and keyless cosign signatures over both).
#
# Vendored rather than delegated to a shared reusable workflow: this repo lives
# under a personal account and GitHub cannot call an org-private reusable
# workflow across that boundary (the caller fails at startup with no logs;
# releases v0.0.16 through v0.0.19 shipped nothing). Re-adopt the shared
# pipeline if the repo moves into the org or that workflow becomes callable
# from outside.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Gate: tag pushes are not covered by ci.yml (main/PR only), so the
  # binaries must not be built unchecked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install --frozen-lockfile
      - run: cd frontend && bun run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build -o /dev/null .

  binary:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Build Vue frontend
        run: bun install --frozen-lockfile && bun run build
        working-directory: frontend
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X latere.ai/x/wallfacer/internal/cli.Version=${VERSION}" \
            -o wallfacer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v7
        with:
          name: wallfacer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wallfacer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: binary
    runs-on: ubuntu-latest
    # id-token: write mints the OIDC token cosign exchanges for a short-lived
    # Fulcio signing certificate (keyless signing — no long-lived key stored in
    # the repo). Job-level permissions replace the workflow default, so
    # contents: write is repeated here to keep release-asset upload working.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wallfacer-*
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: dist
        # One manifest over every published binary. Signing this file (below)
        # transitively attests each binary, since a verified checksum binds the
        # bytes. Users verify with: sha256sum -c SHA256SUMS
        run: sha256sum wallfacer-* | tee SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          # Scan the checked-out source tree (Go modules, frontend deps) rather
          # than the opaque binaries, so the SBOM enumerates real dependencies.
          path: .
          format: spdx-json
          output-file: dist/wallfacer.spdx.json
          # This job publishes the release itself, so let the create step attach
          # the SBOM alongside the other assets instead of the action doing it.
          upload-artifact: false
          upload-release-assets: false
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign checksums and SBOM (keyless)
        working-directory: dist
        env:
          COSIGN_YES: 'true'
        # Sigstore bundles carry the signature, signing certificate, and Rekor
        # transparency-log proof in one file. Verify with:
        #   cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
        #     --certificate-identity-regexp '^https://github.com/changkun/wallfacer/' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     SHA256SUMS
        run: |
          set -euo pipefail
          for f in SHA256SUMS wallfacer.spdx.json; do
            cosign sign-blob --bundle "${f}.cosign.bundle" "$f"
          done
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Read the release note for this tag
        # A tag is a release, and a release has notes. The body is the
        # CHANGELOG.md section for the tag, read by the lateregate this repo
        # pins; no section fails here, before anything is created. The
        # pre-push hook refuses the tag with the same reader. Notes written
        # before this rule stay under docs/releases as history.
        env:
          TAG: ${{ github.ref_name }}
        run: go tool lateregate release-notes "$TAG" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Pre-releases: any tag with a -suffix (v0.0.7-alpha.6, v1.0.0-rc.1).
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          # dist/ now also holds SHA256SUMS, the SPDX SBOM, and the two cosign
          # bundles, so the glob attaches the attestation with the binaries.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --draft=false
          else
            gh release create "$TAG" $prerelease \
              --title "Wallfacer $TAG" \
              --notes-file notes.md --verify-tag \
              dist/*
          fi
